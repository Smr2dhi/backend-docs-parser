name: Pipeline 2 - Backend Docs Generator

on:
  # schedule:
  #   - cron: '30 18 * * *' # Final testing pass hone ke baad uncomment kar lena
  workflow_dispatch:

concurrency:
  group: pipeline-2-backend
  cancel-in-progress: false

jobs:
  # ==========================================
  # JOB 1: PUBLIC SWAGGER PARSER (Port 8082 - No VPN)
  # ==========================================
  public-swagger:
    if: vars.PUBLIC_SWAGGER_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: api-documentation-generator/pom.xml

      - name: Build & Run api-documentation-generator
        working-directory: ./api-documentation-generator
        env:
          PUBLIC_SWAGGER_URL: ${{ vars.PUBLIC_SWAGGER_URL }}
          PUBLIC_PROJECT_NAME: ${{ vars.PUBLIC_PROJECT_NAME }}
          PUBLIC_SWAGGER_TOKEN: ${{ secrets.PUBLIC_SWAGGER_TOKEN }}
        run: |
          chmod +x mvnw
          ./mvnw -B package -DskipTests

          JAR_FILE=$(find target -maxdepth 1 -name "*.jar" ! -name "*original*" | head -n 1)
          java -jar "$JAR_FILE" > /tmp/app.log 2>&1 &
          APP_PID=$!

          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8082; then break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then cat /tmp/app.log; exit 1; fi
            sleep 1
          done

          if [ -n "$PUBLIC_SWAGGER_TOKEN" ]; then
            PAYLOAD=$(jq -n --arg url "$PUBLIC_SWAGGER_URL" --arg name "${PUBLIC_PROJECT_NAME:-Public API}" --arg tok "$PUBLIC_SWAGGER_TOKEN" \
              '{sourceUrl: $url, projectName: $name, authentication: {type: "BEARER", token: $tok}}')
          else
            PAYLOAD=$(jq -n --arg url "$PUBLIC_SWAGGER_URL" --arg name "${PUBLIC_PROJECT_NAME:-Public API}" \
              '{sourceUrl: $url, projectName: $name}')
          fi

          if ! curl -f --max-time 180 -X POST "http://localhost:8082/api/v1/documentation/generate/url" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"; then
            echo "=== api-documentation-generator App Log ==="
            cat /tmp/app.log
            kill -TERM "$APP_PID" || true
            exit 1
          fi

          kill -TERM "$APP_PID" || true
          wait "$APP_PID" 2>/dev/null || true

          LATEST_JSON=$(ls -t generated/*.json | head -n 1)
          cp "$LATEST_JSON" public-swagger.json

      - uses: actions/upload-artifact@v4
        with:
          name: public-swagger
          path: api-documentation-generator/public-swagger.json
          retention-days: 1

  # ==========================================
  # JOB 2: LIFERAY API ANALYZER (Port 8082 + VPN)
  # ==========================================
  liferay-analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: liferay-api-analyzer/pom.xml

      - name: Build liferay-api-analyzer
        working-directory: ./liferay-api-analyzer
        run: |
          chmod +x mvnw
          ./mvnw -B package -DskipTests

      - name: Cache OpenVPN Packages
        id: cache-openvpn
        uses: actions/cache@v4
        with:
          path: ~/openvpn-debs
          key: ${{ runner.os }}-openvpn-debs-v1

      - name: Connect to OpenVPN
        env:
          VPN_CONFIG_BASE64: ${{ secrets.VPN_CONFIG_BASE64 }}
          VPN_USERNAME: ${{ secrets.VPN_USERNAME }}
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: l
        run: |
          if [ "${{ steps.cache-openvpn.outputs.cache-hit }}" == "true" ]; then
            echo "Installing OpenVPN from cache..."
            sudo -E dpkg -i ~/openvpn-debs/*.deb || (sudo apt-get update -qq && sudo -E apt-get install -f -y -qq)
          else
            echo "Downloading and caching OpenVPN..."
            mkdir -p ~/openvpn-debs
            sudo apt-get update -qq
            sudo -E apt-get install -y -qq --no-install-recommends \
              -o dir::cache::archives="$HOME/openvpn-debs" openvpn
          fi

          echo "$VPN_CONFIG_BASE64" | base64 -d > /tmp/vpn.ovpn
          sed -i 's/\r$//' /tmp/vpn.ovpn
          sed -i '/block-outside-dns/d' /tmp/vpn.ovpn
          sed -i '/redirect-gateway/d' /tmp/vpn.ovpn

          printf "%s\n%s\n" "$VPN_USERNAME" "$VPN_PASSWORD" > /tmp/vpn-auth.txt
          chmod 600 /tmp/vpn-auth.txt

          sudo openvpn --config /tmp/vpn.ovpn \
            --auth-user-pass /tmp/vpn-auth.txt \
            --disable-dco \
            --pull-filter ignore "redirect-gateway" \
            --verb 3 > /tmp/openvpn.log 2>&1 &

          for i in $(seq 1 30); do
            if ip a show tun0 >/dev/null 2>&1; then
              echo "OpenVPN connected (tun0 is up)!"
              break
            fi
            sleep 1
          done

          if ! ip a show tun0 >/dev/null 2>&1; then
            echo "OpenVPN failed to connect:"
            sudo cat /tmp/openvpn.log
            exit 1
          fi

      - name: Run liferay-api-analyzer
        working-directory: ./liferay-api-analyzer
        env:
          LIFERAY_BASE_URL: ${{ vars.LIFERAY_BASE_URL }}
          LIFERAY_CLIENT_ID: ${{ secrets.LIFERAY_CLIENT_ID }}
          LIFERAY_CLIENT_SECRET: ${{ secrets.LIFERAY_CLIENT_SECRET }}
        run: |
          JAR_FILE=$(find target -maxdepth 1 -name "*.jar" ! -name "*original*" | head -n 1)
          java -jar "$JAR_FILE" > /tmp/app.log 2>&1 &
          APP_PID=$!

          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8082; then break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then cat /tmp/app.log; exit 1; fi
            sleep 1
          done

          if ! curl -f --max-time 180 -X POST "http://localhost:8082/api/analyzer/discover/generate"; then
            echo "=== liferay-api-analyzer App Log ==="
            cat /tmp/app.log
            kill -TERM "$APP_PID" || true
            exit 1
          fi

          kill -TERM "$APP_PID" || true
          wait "$APP_PID" 2>/dev/null || true

          LATEST_JSON=$(ls -t generated/*.json | head -n 1)
          cp "$LATEST_JSON" liferay-api.json

      - name: Disconnect OpenVPN
        if: always()
        run: |
          sudo killall openvpn || true
          rm -f /tmp/vpn.ovpn /tmp/vpn-auth.txt

      - uses: actions/upload-artifact@v4
        with:
          name: liferay
          path: liferay-api-analyzer/liferay-api.json
          retention-days: 1

  # ==========================================
  # JOB 3: SOURCE CODE ANALYZER (Port 8080 - No VPN)
  # ==========================================
  source-code-analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: source-code-analyzer/pom.xml

      - name: Clone Source Code from Azure DevOps
        env:
          AZURE_USERNAME: ${{ secrets.AZURE_USERNAME }}
          AZURE_PASSWORD: ${{ secrets.AZURE_PASSWORD }}
          AZURE_REPO_URL: ${{ vars.AZURE_REPO_URL }}
        run: |
          ENC_USER=$(jq -rn --arg v "$AZURE_USERNAME" '$v|@uri')
          ENC_PASS=$(jq -rn --arg v "$AZURE_PASSWORD" '$v|@uri')
          git clone --depth 1 "https://${ENC_USER}:${ENC_PASS}@${AZURE_REPO_URL}" /tmp/azure-source-code

      - name: Build & Run source-code-analyzer
        working-directory: ./source-code-analyzer
        run: |
          chmod +x mvnw
          ./mvnw -B package -DskipTests

          JAR_FILE=$(find target -maxdepth 1 -name "*.jar" ! -name "*original*" | head -n 1)
          java -jar "$JAR_FILE" > /tmp/app.log 2>&1 &
          APP_PID=$!

          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8080; then break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then cat /tmp/app.log; exit 1; fi
            sleep 1
          done

          if ! curl -f --max-time 180 -X POST "http://localhost:8080/api/analyzer/scan" \
            -H "Content-Type: application/json" \
            -d '{"repositoryPath": "/tmp/azure-source-code/"}' \
            -o source-code.json; then
            echo "=== source-code-analyzer App Log ==="
            cat /tmp/app.log
            kill -TERM "$APP_PID" || true
            exit 1
          fi

          kill -TERM "$APP_PID" || true
          wait "$APP_PID" 2>/dev/null || true

      - name: Cleanup Cloned Source Code
        if: always()
        run: rm -rf /tmp/azure-source-code

      - uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: source-code-analyzer/source-code.json
          retention-days: 1

  # ==========================================
  # JOB 4: SHA-256 DEDUP, PUSH & DISPATCH
  # ==========================================
  push-to-central-hub:
    needs: [public-swagger, liferay-analyzer, source-code-analyzer]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Generated JSONs
        uses: actions/download-artifact@v4
        with:
          path: output

      - name: Normalize JSON, Compare SHA-256 & Push
        id: push_data
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.CENTRAL_REPO_PAT }}@github.com/harshh122/central-docs-hub.git central-docs
          mkdir -p central-docs/backend

          find output -type f -name "*.json" | while read -r file; do
            rel_path="${file#output/}"
            dest="central-docs/backend/$rel_path"
            mkdir -p "$(dirname "$dest")"

            jq -S -c . "$file" > /tmp/normalized.json
            new_hash=$(sha256sum /tmp/normalized.json | awk '{print $1}')
            old_hash=$([ -f "$dest" ] && sha256sum "$dest" | awk '{print $1}' || echo "")

            if [ "$new_hash" = "$old_hash" ]; then
              echo "Skipping unchanged JSON (SHA-256 match): $rel_path"
            else
              echo "Updating JSON (SHA-256 changed): $rel_path"
              cp /tmp/normalized.json "$dest"
            fi
          done
          rm -f /tmp/normalized.json

          cd central-docs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend

          if git diff --staged --quiet; then
            echo "No changes for backend."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update backend JSON docs"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Central Hub (Pipeline 3)
        if: steps.push_data.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CENTRAL_REPO_PAT }}
          repository: harshh122/central-docs-hub
          event-type: json-data-updated
          client-payload: '{"source": "backend"}'
